server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the browser calls /api/* on this host and nginx forwards it
    # to the backend. ^~ keeps the static-asset regex below from capturing
    # /api/images/*.png. The variable + resolver make nginx re-resolve "backend"
    # through Docker DNS instead of pinning the IP it had at startup.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        client_max_body_size 11m;   # largest image upload limit is 10 MB
    }

    # SPA / client-side routing: serve index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for fingerprinted assets (Astro adds content hash to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for the HTML entry point so updates are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

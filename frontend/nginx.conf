server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Keep redirects (/providers -> /providers/) relative. By default nginx
    # builds an absolute http://<host>:3000/... URL, which is wrong behind the
    # Cloudflare Tunnel (https, no public port 3000).
    absolute_redirect off;

    # Security headers. "always" also covers error pages. nginx inherits
    # add_header into a location only if the location declares none of its own,
    # so /_astro/ below repeats these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Same-origin API: the browser calls /api/* on this host and nginx forwards it
    # to the backend. ^~ keeps the other locations from capturing
    # /api/images/*.png. The variable + resolver make nginx re-resolve "backend"
    # through Docker DNS instead of pinning the IP it had at startup.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        client_max_body_size 11m;   # largest image upload limit is 10 MB
    }

    # Fingerprinted build output: Astro puts a content hash in these file names,
    # so a deploy never reuses a URL and they can be cached for a year.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }

    # Everything else (HTML pages, sw.js, logos, service images) keeps a stable
    # URL, so browsers and Cloudflare must revalidate it: a deploy shows up at
    # once instead of after a year. Unknown paths get a real 404, not index.html.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
